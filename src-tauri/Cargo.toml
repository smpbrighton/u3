[package]
name = "u3"
version = "1.0.0"
description = "U3 desktop studio"
authors = ["Brighton AI Holdings"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14"
semver = "1"
uuid = { version = "1", features = ["v4"] }

[workspace]
members = ["../native/u3-key-store"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
